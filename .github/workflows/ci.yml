name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Domain & Integration Tests
        run: npm test

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://demo-veloce.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "demo-anon-key-veloce-studio"
